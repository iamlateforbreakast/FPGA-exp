# Usage (podman):
#   podman compose build -f FPGA-exp-build
#   podman compose run --rm FPGA-tools-build
#   podman compose build -f FPGA-exp-dev
#   podman compose run --rm FPGA-exp-dev
# Also works with `docker compose` unmodified.

services:
  fpga-tools-build:
    build:
      context: .
      dockerfile: Containerfile
      target: FPGA-tools-build
    image: fpga-exp-builder:latest
    container_name: fpga-exp-builder
    working_dir: /tmp
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
  fpga-exp-dev:
    build:
      context: .
      dockerfile: Containerfile
      target: FPGA-exp-dev
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    image: fpga-exp-dev:latest
    container_name: fpga-exp-dev
    user: builder
    working_dir: /home/builder
    volumes:
      - .:/home/builder/workspace:Z
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
  fpga-exp-flash:
    build:
      context: .
      dockerfile: Containerfile
      target: FPGA-exp-flash
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    image: fpga-exp-flash:latest
    container_name: fpga-exp-flash
    user: builder
    working_dir: /home/builder
    volumes:
      - .:/home/builder/workspace:Z
    devices:
      - /dev/bus/usb:/dev/bus/usb
    tty: true
    stdin_open: true
    command: ["/bin/bash"]