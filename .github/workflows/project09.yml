name: Project09
run-name: ${{ github.actor }} is generating the Verilog files. 🚀

on:
  push:
    paths: 'all_projects/project09/**' # Triggers only if update is project09

jobs:
  Project09-Build-And-Generate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.2.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup OCAML and Opam environment
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          allow-prerelease-opam: true
      - name: Install Hardcaml and dependencies
        working-directory: all_projects/project09/rpi_spi_hardcaml
        run: |
          opam install hardcaml ppx_hardcaml hardcaml_waveterm
      - name: Generate Verilog
        working-directory: all_projects/project09/rpi_spi_hardcaml
        run: opam exec -- dune build
